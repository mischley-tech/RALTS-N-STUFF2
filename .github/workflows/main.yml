name: Build Ralts APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and Patch Project
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
          SELECTED=""
          for z in *.zip; do
            if [ -f "$z" ] && unzip -l "$z" | grep -q "RaltsOverlayService.kt"; then
              SELECTED="$z"
            fi
          done
          if [ -z "$SELECTED" ]; then
            SELECTED=$(ls -t *.zip 2>/dev/null | head -n 1)
          fi
          echo "Using project archive: $SELECTED"
          unzip -o "$SELECTED"
          sed -i 's/compileSdk = 35/compileSdk = 34/g; s/targetSdk = 35/targetSdk = 34/g' app/build.gradle.kts
          sed -i 's/implementation("androidx.core:core-ktx:1.13.1")//g' app/build.gradle.kts
          sed -i 's/layoutParams/overlayParams/g' app/src/main/java/com/hoenn/raltspet/RaltsOverlayService.kt

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RaltsEmeraldPet-Pixel-APK
          path: app/build/outputs/apk/debug/app-debug.apk
