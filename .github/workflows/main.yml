- name: Extract and Patch Project
     run: |
       rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
       SELECTED=""
       for z in *.zip; do
         if [ -f "$z" ] && unzip -p "$z" app/build.gradle.kts 2>/dev/null | grep -q '1.3.0'; then
           SELECTED="$z"
         fi
       done
       if [ -z "$SELECTED" ]; then
         SELECTED=$(ls -t *.zip 2>/dev/null | head -n 1)
       fi
       echo "Using project archive: $SELECTED"
       unzip -o "$SELECTED"
